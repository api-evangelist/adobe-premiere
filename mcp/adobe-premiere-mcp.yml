tools:
- name: list_libraries
  description: List the Creative Cloud Libraries available to the authenticated user.
  rest: [getLibraries]
- name: create_library
  description: Create a new Creative Cloud Library.
  rest: [createLibraries]
- name: get_library
  description: Retrieve a single Creative Cloud Library by id.
  rest: [getLibrary]
- name: update_library
  description: Update a library's metadata (name and other fields).
  rest: [updateLibrary, patchLibrary]
- name: delete_library
  description: Delete a Creative Cloud Library.
  rest: [deleteLibrary]
- name: list_library_elements
  description: List the elements (colors, graphics, videos, character styles) inside a library.
  rest: [getLibraryElements]
- name: get_library_element
  description: Retrieve one element from a library.
  rest: [getLibraryElement]
- name: create_library_elements
  description: Create, copy or move elements within or between libraries.
  rest: [postLibraryElements]
- name: update_library_element_metadata
  description: Update metadata on one or more library elements.
  rest: [updateLibraryElements]
- name: archive_library_element
  description: Move a library element to the archive (soft delete, reversible).
  rest: [archiveLibraryElement, archiveLibraryElements]
- name: restore_archived_elements
  description: Restore elements from a library's archive.
  rest: [unArchiveLibraryElements]
- name: purge_archived_elements
  description: Permanently delete archived elements. Irreversible.
  rest: [deleteLibraryElements, deleteLibraryElement]
- name: put_element_representations
  description: Replace the representations/renditions attached to a library element.
  rest: [putLibraryElementRepresentations]
- name: upload_representation_content
  description: Upload the binary content backing an element representation.
  rest: [postLibraryComponent]
- name: list_bookmarks
  description: List the user's library bookmarks.
  rest: [getBookmarks]
- name: add_bookmark
  description: Bookmark a library.
  rest: [addLibraryBookmarks]
- name: update_bookmark
  description: Update a library bookmark.
  rest: [putLibraryBookmark]
- name: remove_bookmark
  description: Remove a library bookmark.
  rest: [removeLibraryBookmark]
- name: get_public_library
  description: Retrieve a public (shared) library without user context.
  rest: [getPublicLibrary, getPublicLibraryElements, getPublicLibraryElement]
- name: search_libraries
  description: Search across libraries and elements.
  rest: [search]
