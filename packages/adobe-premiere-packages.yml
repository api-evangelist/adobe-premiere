note: >-
  Adobe Premiere Pro's programmable surface is UXP (Unified Extensibility Platform) — an in-process
  JavaScript DOM, not an HTTP API — so the first-party "SDK" is a set of TypeScript declaration
  packages plus a lint plugin, published to npm by the `adobe-admin` account from repositories in the
  github.com/adobe organization. The Creative Cloud Libraries REST API used by Premiere panels ships
  no first-party client library; Adobe distributes a Postman collection and a raw spec repository
  instead (see collections/ and openapi/).
