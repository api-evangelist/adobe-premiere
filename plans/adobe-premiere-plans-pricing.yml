source: >-
  Searched https://developer.adobe.com/premiere-pro/uxp/ (200), the Creative Cloud Libraries
  documentation tree (overview / integrate / go-live, all 200) and
  https://developer.adobe.com/console/ on 2026-08-30. No pricing, plan, tier or quota page exists for
  either the Premiere UXP API or the Creative Cloud Libraries API.
supersedes: >-
  This file previously carried a bulk-sweep scaffold dated 2026-05-04 that invented Free / Pro /
  Enterprise tiers with placeholder prices. Adobe publishes no such tiers. The scaffold has been
  removed rather than left to be read as provider-published pricing.
plan_count: 0
plans: []
note: >-
  Adobe does not price these APIs as a product. Access to the Premiere UXP API is a property of
  owning Premiere Pro — the plugin surface ships with the application and costs nothing extra to
  build against. Access to the Creative Cloud Libraries REST API is granted per Adobe Developer
  Console project and is gated by review, not by a price list: an integration goes through Adobe's
  submission and review process before it can go live
  (https://developer.adobe.com/creative-cloud-libraries/docs/go-live/review-process/). The commercial
  relationship that actually applies is the end user's Creative Cloud subscription, sold on
  adobe.com and not exposed as a developer plan.
monetization_for_developers:
  detail: >-
    Adobe does publish the reverse direction — how a DEVELOPER charges for a plugin. UXP plugins
    distributed through the Creative Cloud Marketplace may be free or paid, and require Adobe review;
    directly distributed plugins require no review.
  source: https://developer.adobe.com/premiere-pro/uxp/plugins/distribution/overview/
