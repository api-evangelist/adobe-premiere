  description: >-
    Adobe Premiere Pro extension APIs using UXP (Unified Extensibility Platform) and CEP (Common Extensibility
    Platform) for building plugins and panels that automate video editing workflows, add custom effects,
    integrate with external hardware, and extend the Premiere Pro user interface.
  image: https://www.adobe.com/content/dam/cc/icons/premiere.svg
  humanURL: https://developer.adobe.com/premiere-pro/
  baseURL: https://developer.adobe.com/premiere-pro/uxp/
  x-base-url-note: >-
    The Premiere UXP API is an in-process JavaScript DOM inside the Premiere Pro desktop application
    (const app = require('premierepro')). It has NO HTTP endpoint. The previous value
    https://api.adobe.io/premiere was a guess and returns 404 (probed 2026-08-30); the documentation
    root is recorded instead rather than inventing a host.
