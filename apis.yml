- aid: adobe-premiere:adobe-creative-cloud-libraries-api
  name: Adobe Creative Cloud Libraries API
  description: >-
    Adobe's published REST API for Creative Cloud Libraries — the shared asset store (colors,
    character styles, brushes, graphics, patterns and video) that Premiere Pro panels read and write.
    25 operations across libraries, elements, representations, bookmarks, public libraries and
    search, on https://cc-libraries.adobe.io. Adobe publishes the contract itself from its own
    AdobeDocs GitHub organization and renders it at developer.adobe.com/creative-cloud-libraries.
  humanURL: https://developer.adobe.com/creative-cloud-libraries/docs/
