aid: adobe-premiere
url: https://raw.githubusercontent.com/api-evangelist/adobe-premiere/refs/heads/main/apis.yml
name: Adobe Premiere Pro
description: >-
  Adobe Premiere Pro is a professional non-linear video editor. Its programmable surface has two
  halves: the Premiere UXP API, an in-process JavaScript DOM for plugins and panels that automate
  editing, extend the timeline and integrate hardware or media asset management systems inside the
  desktop application; and the Adobe Creative Cloud Libraries REST API on cc-libraries.adobe.io,
  which is what a Premiere panel calls over HTTP to read and write shared assets — colors, character
  styles, graphics, patterns and video — along with an Adobe I/O Events webhook surface for library
  changes.
